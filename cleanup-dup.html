<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تنظيف تكرار شهر 8 — دار الأرقم</title>
<!--
  صفحة مؤقتة لحذف سجل month_summary محلي مكرر واحد على هذا الجهاز فقط.
  - تفتح IndexedDB (dar_alarqam_db) بدون رقم إصدار (لا onupgradeneeded → لا تعديل مخطط).
  - تقرأ أولاً، وتحذف فقط السجل ذا المعرّف المحدّد من مخزن month_summary، بعد ضغط زر مؤكّد.
  - لا تتصل بـ Supabase إطلاقاً، لا force push، لا تلمس أي مخزن آخر ولا أي سجل آخر.
  - شرط أمان: لا تحذف إلا إذا كان الصف الصحيح (715c5ad5) موجوداً محلياً أيضاً،
    حتى لا يبقى شهر 8 بلا ملخص على هذا الجهاز.
  تُحذف هذه الصفحة بعد التنظيف.
-->
<style>
  body{ margin:0; background:#f6f3ec; color:#2c2417; font-family:"IBM Plex Sans Arabic",system-ui,Segoe UI,Tahoma,sans-serif; line-height:1.7; padding:16px; }
  .wrap{ max-width:620px; margin:0 auto; }
  h1{ font-size:1.2rem; }
  .card{ background:#fff; border:1px solid #e5ddcc; border-radius:14px; padding:16px; margin-bottom:14px; }
  .note{ background:#fbf7ec; border:1px solid #efe4c8; color:#6b5a2a; border-radius:10px; padding:10px 12px; font-size:.85rem; }
  code{ font-size:.78rem; color:#6b6250; direction:ltr; }
  button{ width:100%; border:none; border-radius:12px; padding:14px; font-size:1rem; font-weight:700; font-family:inherit; cursor:pointer; }
  .danger{ background:#c0392b; color:#fff; } .danger:disabled{ opacity:.5; cursor:not-allowed; }
  .row{ padding:6px 0; border-bottom:1px dashed #e5ddcc; font-size:.9rem; }
  .ok{ color:#1d7a4d; } .err{ color:#9a1b1b; } .tiny{ font-size:.8rem; color:#6b6250; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>تنظيف تكرار شهر 8 (هذا الجهاز فقط)</h1>
  <div class="card"><div class="note">
    هذه الصفحة تحذف <b>سجلاً واحداً مكرراً</b> من ذاكرة هذا الجهاز فقط. لا ترفع ولا تتصل بالسحابة،
    ولا تلمس أي بيانات أخرى. تأكد أنك على جهاز Samsung المرجعي.
  </div></div>

  <div class="card">
    <div><b>الحالة الحالية محلياً لشهر 8:</b></div>
    <div id="rows">جارٍ القراءة…</div>
  </div>

  <button id="delBtn" class="danger" disabled>حذف السجل المكرر (201d96d4)</button>
  <div class="tiny" id="msg"></div>
</div>

<script>
(function(){
  "use strict";
  var DB_NAME = "dar_alarqam_db";
  var STORE = "month_summary";
  var MONTH8 = "af7f3bfb-352e-4323-a350-88caba4cfdaf";
  var KEEP_ID = "715c5ad5-45dc-4d7b-a327-af3fe257054f"; // الصف الصحيح
  var DUP_ID  = "201d96d4-0007-4d6e-b58e-485627d6fc3d"; // المكرر المطلوب حذفه
  var dbRef = null, canDelete = false;

  function open(){ return new Promise(function(res,rej){ var r=indexedDB.open(DB_NAME); r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }
  function getAll(db){ return new Promise(function(res,rej){ if(!db.objectStoreNames.contains(STORE))return res([]); var q=db.transaction(STORE,"readonly").objectStore(STORE).getAll(); q.onsuccess=function(){res(q.result||[]);}; q.onerror=function(){rej(q.error);}; }); }

  function render(rows){
    var m8 = rows.filter(function(r){ return r.month_id===MONTH8; });
    var hasDup = m8.some(function(r){ return r.id===DUP_ID; });
    var hasKeep = m8.some(function(r){ return r.id===KEEP_ID; });
    var html = "";
    m8.forEach(function(r){
      var tag = r.id===DUP_ID ? ' <b class="err">(المكرر — سيُحذف)</b>' : (r.id===KEEP_ID ? ' <b class="ok">(الصحيح — يبقى)</b>' : '');
      html += '<div class="row"><code>'+r.id+'</code>'+tag+'</div>';
    });
    if(!m8.length) html = '<div class="row">لا توجد ملخصات محلية لشهر 8 على هذا الجهاز.</div>';
    document.getElementById("rows").innerHTML = html;

    // شرط الحذف: المكرر موجود + الصف الصحيح موجود أيضاً (حتى لا يبقى الشهر بلا ملخص)
    canDelete = hasDup && hasKeep;
    var btn = document.getElementById("delBtn");
    btn.disabled = !canDelete;
    if(hasDup && !hasKeep){
      document.getElementById("msg").innerHTML = '<span class="err">الصف الصحيح (715c5ad5) غير موجود محلياً بعد. افتح التطبيق وزامن أولاً ثم أعد المحاولة — تفادياً لترك الشهر بلا ملخص.</span>';
    } else if(!hasDup){
      document.getElementById("msg").innerHTML = '<span class="ok">لا يوجد سجل مكرر على هذا الجهاز — لا حاجة لأي إجراء.</span>';
    }
  }

  function load(){ open().then(function(db){ dbRef=db; return getAll(db); }).then(render)
    .catch(function(e){ document.getElementById("rows").innerHTML = '<span class="err">تعذّر القراءة: '+(e&&e.message||e)+'</span>'; }); }

  document.getElementById("delBtn").addEventListener("click", function(){
    if(!canDelete || !dbRef) return;
    if(!confirm("سيتم حذف السجل المكرر 201d96d4 من هذا الجهاز فقط. متابعة؟")) return;
    // تحقق أخير داخل نفس المعاملة: اقرأ السجل، تأكد أنه يخص شهر 8، ثم احذفه
    var tx = dbRef.transaction(STORE, "readwrite");
    var store = tx.objectStore(STORE);
    var g = store.get(DUP_ID);
    g.onsuccess = function(){
      var rec = g.result;
      if(!rec){ document.getElementById("msg").innerHTML = '<span class="ok">السجل غير موجود (ربما حُذف سابقاً).</span>'; return; }
      if(rec.month_id !== MONTH8){ document.getElementById("msg").innerHTML = '<span class="err">توقف: السجل لا يخص شهر 8 — لم يُحذف شيء.</span>'; tx.abort(); return; }
      var d = store.delete(DUP_ID);
      d.onsuccess = function(){};
    };
    tx.oncomplete = function(){ verify(); };
    tx.onerror = function(){ document.getElementById("msg").innerHTML = '<span class="err">فشل الحذف: '+(tx.error&&tx.error.message||'')+'</span>'; };
  });

  function verify(){ getAll(dbRef).then(function(rows){
    var m8 = rows.filter(function(r){ return r.month_id===MONTH8; });
    var ok = m8.length===1 && m8[0].id===KEEP_ID;
    document.getElementById("msg").innerHTML = ok
      ? '<span class="ok">تم ✓ شهر 8 الآن له صف محلي واحد فقط: 715c5ad5. لم تُلمس السحابة ولا باقي الشهور.</span>'
      : '<span class="err">تحقّق: عدد صفوف شهر 8 = '+m8.length+'. راجع القائمة.</span>';
    render(rows);
  }); }

  load();
})();
</script>
</body>
</html>
